apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stratigraph-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratigraph-postgres
  labels:
    app.kubernetes.io/name: stratigraph-postgres
    app.kubernetes.io/part-of: stratigraph
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stratigraph-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stratigraph-postgres
        app.kubernetes.io/part-of: stratigraph
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: em_documents
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stratigraph-server-secrets
                  key: EM_DOCUMENTS_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stratigraph-server-secrets
                  key: EM_DOCUMENTS_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=C"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -q"]
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stratigraph-postgres-data
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stratigraph-postgres
  labels:
    app.kubernetes.io/name: stratigraph-postgres
spec:
  selector:
    app.kubernetes.io/name: stratigraph-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
