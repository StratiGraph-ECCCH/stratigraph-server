apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stratigraph-s3-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # THE STUDY FILES — models, images, PDFs. Size it to the project.
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratigraph-s3
  labels:
    app.kubernetes.io/name: stratigraph-s3
    app.kubernetes.io/part-of: stratigraph
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stratigraph-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stratigraph-s3
        app.kubernetes.io/part-of: stratigraph
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs:1.0.2
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            # the admin console is NOT served: no port, no Route
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stratigraph-server-secrets
                  key: EM_ASSET_S3_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stratigraph-server-secrets
                  key: EM_ASSET_S3_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stratigraph-s3-data
---
apiVersion: v1
kind: Service
metadata:
  name: stratigraph-s3
  labels:
    app.kubernetes.io/name: stratigraph-s3
spec:
  selector:
    app.kubernetes.io/name: stratigraph-s3
  ports:
    - name: s3
      port: 9000
      targetPort: s3
