# The node's secrets — EMPTY on purpose: the names of the keys, and nothing
# else. Fill them out of version control, e.g.
#
#   oc create secret generic stratigraph-server-secrets \
#     --from-literal=EM_ASSET_S3_ACCESS_KEY=… --from-literal=EM_ASSET_S3_SECRET_KEY=… \
#     --dry-run=client -o yaml | oc apply -f -
#
# Re-applying this file would blank them again: once the real values are in,
# drop this resource from your overlay (`overlays/casa/README` says how).
apiVersion: v1
kind: Secret
metadata:
  name: stratigraph-server-secrets
type: Opaque
stringData:
  # obligatory — the object store's key pair
  EM_ASSET_S3_ACCESS_KEY: ""
  EM_ASSET_S3_SECRET_KEY: ""
  # obligatory only when EM_DOCUMENTS_HOST is set
  EM_DOCUMENTS_USER: ""
  EM_DOCUMENTS_PASSWORD: ""
  # optional — Keycloak admin API: a service-account client (preferred) …
  EM_KC_ADMIN_CLIENT_ID: ""
  EM_KC_ADMIN_CLIENT_SECRET: ""
  # … or an admin user
  EM_KC_ADMIN_USER: ""
  EM_KC_ADMIN_PASSWORD: ""
