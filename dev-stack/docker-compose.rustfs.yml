# LA PILA DI PROVA: RustFS al posto di MinIO, ACCANTO alla pila di sviluppo.
#
# Non è un secondo modo di fare il nodo e non sostituisce niente: è la prova
# chiesta il 17 ottobre 2026 per avere i numeri su RustFS prima che E.D. decida
# (MinIO community si è allontanata dall'open source). La pila di sviluppo
# (`docker-compose.dev.yml`, progetto `em-dev`) resta accesa e intatta mentre
# questa gira: progetto suo, porte sue, volumi suoi.
#
#   docker compose -p rustfs-prova --env-file <file di prova> \
#       -f docker-compose.rustfs.yml up -d
#   docker compose -p rustfs-prova --env-file <file di prova> \
#       -f docker-compose.rustfs.yml down          # i volumi RESTANO
#
# Il file di prova tiene RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY / RUSTFS_BUCKET /
# PROVA_PG_PASSWORD — credenziali GENERATE per la prova, fuori dal repository
# (vedi README-RUSTFS.md). Nessun default qui: una pila che parte con
# `rustfsadmin/rustfsadmin` perché qualcuno ha dimenticato il file è proprio la
# pila che non si vuole.
#
# Cosa c'è: RustFS, l'em-server di sviluppo (STESSA immagine, STESSO codice
# montato) con l'asset store puntato a RustFS, un Postgres suo per i documenti,
# e Cantaloupe che legge dallo stesso bucket — perché anche lui parla S3, e una
# prova che lo lasciasse su MinIO non misurerebbe il cambio intero.
#
# Cosa NON c'è: Keycloak. Si RIUSA quello della pila di sviluppo, in sola
# lettura: questo em-server ne scarica soltanto le chiavi pubbliche (JWKS)
# dalla porta di loopback dell'host, e accetta gli stessi token di `token.sh`.
# Nessun realm toccato, nessuna rete di `em-dev` attraversata.

name: rustfs-prova

services:
  # =======================================================================
  # OBJECT STORE — RustFS, un disco solo
  # =======================================================================
  rustfs:
    # ── PINNATA, E IL DIGEST ACCANTO ────────────────────────────────────────
    #
    # Stessa regola di MinIO nella pila di sviluppo: il tag si può ripuntare, il
    # digest no. Misurato il 17 ottobre 2026: `rustfs/rustfs:1.0.2` (rilascio
    # stabile del 16 ottobre 2026, Apache-2.0) risolve a questo digest — è
    # l'indice multi-architettura; su questo Mac ha dato l'immagine arm64.
    image: rustfs/rustfs:1.0.2  # sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    container_name: rustfs-prova-rustfs
    environment:
      # Un volume, un disco: la stessa forma della MinIO di sviluppo
      # (`server /data`). La pila d'esempio di RustFS ne usa quattro per
      # l'erasure coding; qui si confronta con ciò che gira, non con il meglio.
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:?manca il file di prova: vedi README-RUSTFS.md}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:?manca il file di prova: vedi README-RUSTFS.md}"
    ports:
      # `127.0.0.1:` DAVANTI, per la ragione scritta sulla MinIO di sviluppo: il
      # nodo di campo fa da hotspot ai tablet del cantiere, e una porta su
      # `0.0.0.0` è un servizio raggiungibile da ogni dispositivo attaccato.
      #
      # 9101 è la CONSOLE DI AMMINISTRAZIONE di RustFS, con le credenziali di
      # root: su loopback resta apribile dal browser di questo Mac
      # (`http://localhost:9101/rustfs/console/`) e da nessun altro — come la
      # 9001 di MinIO. Porte 91xx e non 90xx: le 9000/9001 sono della pila di
      # sviluppo, che resta accesa.
      - "127.0.0.1:${RUSTFS_API_PORT:-9100}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9101}:9001"
    volumes:
      # L'immagine gira come 10001 e la sua `/data` è già di 10001: un volume
      # nominato e vuoto ne eredita il proprietario alla prima creazione, quindi
      # niente `chown` a parte (misurato).
      - rustfs_data:/data
    healthcheck:
      # L'endpoint di prontezza di RustFS, non una porta aperta: lo stesso
      # principio del `mc ready local` di MinIO. curl è nell'immagine.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Un one-shot: il bucket, PRIMA della prima richiesta, come `minio-init`. Senza
  # `mc`: è uno strumento di MinIO, e la prova è proprio fare a meno di MinIO.
  # Una `PUT /<bucket>` firmata SigV4 con il curl dell'immagine di RustFS è la
  # CreateBucket di S3 e nient'altro; 409 (BucketAlreadyOwnedByYou) è «c'è già».
  rustfs-init:
    image: rustfs/rustfs:1.0.2  # sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    container_name: rustfs-prova-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
      RUSTFS_BUCKET: "${RUSTFS_BUCKET:?manca il file di prova: vedi README-RUSTFS.md}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
          --aws-sigv4 'aws:amz:us-east-1:s3' \
          --user "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" \
          "http://rustfs:9000/$$RUSTFS_BUCKET")
        case "$$code" in
          200|409) echo "bucket ready: $$RUSTFS_BUCKET ($$code)" ;;
          *) echo "bucket NOT created: HTTP $$code"; exit 1 ;;
        esac
    restart: "no"

  # I volumi dei dati all'utente dell'immagine del server, come `volumi-init`.
  volumi-init:
    image: alpine:3.24.1  # sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: rustfs-prova-volumi-init
    user: "0:0"
    network_mode: none
    volumes:
      - em_data:/volumi/em-data
    entrypoint: ["/bin/sh", "-c", "chown -R 10001:0 /volumi/em-data && chmod -R g=u /volumi/em-data"]
    restart: "no"

  # =======================================================================
  # LA CASA DEI DOCUMENTI — un Postgres suo, non quello di sviluppo
  # =======================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rustfs-prova-postgres
    environment:
      POSTGRES_DB: "em_documents"
      POSTGRES_USER: "em"
      POSTGRES_PASSWORD: "${PROVA_PG_PASSWORD:?manca il file di prova: vedi README-RUSTFS.md}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # nessuna porta pubblicata: lo legge solo l'em-server di prova, sulla rete
    # di questo progetto
    volumes:
      - em_documents_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U em -d em_documents -q"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # =======================================================================
  # IIIF — Cantaloupe, dallo STESSO bucket, su RustFS
  # =======================================================================
  cantaloupe:
    image: islandora/cantaloupe@sha256:938d15c162c3da1436f10f79cd1c81c8cf412f996fb625c55874194c28bc0077  # Cantaloupe 5.0.7
    container_name: rustfs-prova-cantaloupe
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      CANTALOUPE_HTTP_ENABLED: "true"
      CANTALOUPE_HTTP_HOST: "0.0.0.0"
      CANTALOUPE_HTTP_PORT: "8182"
      CANTALOUPE_HTTPS_ENABLED: "false"
      CANTALOUPE_ENDPOINT_IIIF_3_ENABLED: "true"
      CANTALOUPE_ENDPOINT_IIIF_2_ENABLED: "true"
      CANTALOUPE_ENDPOINT_IIIF_1_ENABLED: "false"
      CANTALOUPE_ENDPOINT_ADMIN_ENABLED: "false"
      CANTALOUPE_ENDPOINT_API_ENABLED: "false"
      CANTALOUPE_ENDPOINT_HEALTH_ENABLED: "true"
      CANTALOUPE_SOURCE_STATIC: "S3Source"
      CANTALOUPE_S3SOURCE_ENDPOINT: "http://rustfs:9000"
      CANTALOUPE_S3SOURCE_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY}"
      CANTALOUPE_S3SOURCE_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
      CANTALOUPE_S3SOURCE_REGION: "us-east-1"
      CANTALOUPE_S3SOURCE_LOOKUP_STRATEGY: "BasicLookupStrategy"
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_BUCKET_NAME: "${RUSTFS_BUCKET}"
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: ""
      CANTALOUPE_S3SOURCE_BASICLOOKUPSTRATEGY_PATH_SUFFIX: ""
      CANTALOUPE_PROCESSOR_SELECTION_STRATEGY: "AutomaticSelectionStrategy"
      # spenta per la ragione misurata e scritta nella pila di sviluppo
      CANTALOUPE_CACHE_SERVER_DERIVATIVE_ENABLED: "false"
      CANTALOUPE_CACHE_SERVER_INFO_ENABLED: "false"
      CANTALOUPE_LOG_APPLICATION_LEVEL: "info"
    ports:
      - "127.0.0.1:${PROVA_CANTALOUPE_PORT:-8183}:8182"
    restart: unless-stopped

  # =======================================================================
  # LA STANZA — l'em-server di sviluppo, puntato a RustFS
  # =======================================================================
  stratigraph-server:
    # L'immagine che la pila di sviluppo ha già costruito, e NIENTE `build:`:
    # un `up` qui non deve ricostruire né rietichettare l'immagine di `em-dev`.
    # Il codice è quello montato da `../app`, come nella pila di sviluppo.
    image: stratigraph-server:dev
    container_name: rustfs-prova-server
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      volumi-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    extra_hosts:
      # su Docker Desktop c'è già; su Colima / Linux lo dà questa riga
      - "host.docker.internal:host-gateway"
    environment:
      # --- identità: il Keycloak di sviluppo, IN SOLA LETTURA ----------------
      # L'emittente è quello che il token DICE (lo stesso della pila di
      # sviluppo); le chiavi si prendono dalla porta di loopback dell'host, che
      # è l'unica strada verso quel Keycloak senza entrare nella rete di em-dev.
      OIDC_ISSUER: "${OIDC_ISSUER:-https://em.localhost:8443/auth/realms/em-dev}"
      OIDC_JWKS_URI: "http://host.docker.internal:${KEYCLOAK_PORT:-8085}/auth/realms/em-dev/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "em-server"
      EM_NATIVE_CLIENT_ID: "em-tools"
      # --- l'object store: RustFS -----------------------------------------
      # I nomi DI OGGI. `MINIO_*` è il nome del client, non del servizio: il
      # valore è un S3 qualunque. Qui si usa l'altra grafia che il server legge
      # già (`EM_ASSET_S3_*`, quella del ruolo Ansible), così il file non dice
      # «minio» di una cosa che non lo è. `MINIO_SECURE` non ha un gemello: lo
      # schema `http://` dell'endpoint basta (vedi `assets._minio_settings`).
      EM_ASSET_S3_ENDPOINT: "http://rustfs:9000"
      EM_ASSET_S3_ACCESS_KEY: "${RUSTFS_ACCESS_KEY}"
      EM_ASSET_S3_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
      EM_ASSET_S3_BUCKET: "${RUSTFS_BUCKET}"
      # --- i documenti delle stanze ----------------------------------------
      EM_DOCUMENTS_HOST: "postgres"
      EM_DOCUMENTS_DB: "em_documents"
      EM_DOCUMENTS_USER: "em"
      EM_DOCUMENTS_PASSWORD: "${PROVA_PG_PASSWORD}"
      EM_SNAPSHOT_DIR: "/srv/em-data/snapshots"
      EM_CORPUS_CURATORS: "${DEV_CURATOR_ORCID:-0000-0002-1825-0097}"
      EM_OPERATORS: "${DEV_OPERATOR_ORCID:-0000-0002-1825-0097}"
      # --- immagini: Cantaloupe di QUESTA pila ------------------------------
      # Niente Caddy qui: il pubblico è la porta di loopback di Cantaloupe, che
      # per una prova su questo Mac è onesto (vedi la nota in README-RUSTFS.md).
      EM_IIIF_PUBLIC: "http://localhost:${PROVA_CANTALOUPE_PORT:-8183}/iiif/3"
      EM_IIIF_INTERNAL: "http://cantaloupe:8182/iiif/3"
      EM_PUBLIC_BASE: "http://localhost:${PROVA_SERVER_PORT:-8100}"
      EM_ACCREDITED_FILE: "/srv/em-node/accredited.yaml"
      # la console nella mappa del nodo: quella di RustFS, sul loopback
      EM_MINIO_CONSOLE_URL: "http://localhost:${RUSTFS_CONSOLE_PORT:-9101}/rustfs/console/"
      NODEODM_ENABLED: "false"
      PYTHONPATH: "/srv/s3dgraphy-src"
    ports:
      - "127.0.0.1:${PROVA_SERVER_PORT:-8100}:8000"
    volumes:
      - em_data:/srv/em-data
      - ../app:/srv/em-server/app:ro
      - ../../s3Dgraphy/src:/srv/s3dgraphy-src:ro
      - ./accredited.yaml:/srv/em-node/accredited.yaml:ro
    restart: unless-stopped

volumes:
  rustfs_data:        # gli oggetti — nella prova, copie: l'originale resta in MinIO
  em_data:
  em_documents_data:
