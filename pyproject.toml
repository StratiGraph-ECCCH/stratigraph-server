[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratigraph-server"
# Kept in step with `app/__init__.py.__version__` — static metadata cannot
# import, so this is the one unavoidable repetition, and a test refuses a
# disagreement. See that module for what the number means.
version = "1.6.0.dev1"
description = "The s3Dgraphy access API over HTTP — thin FastAPI wrapper (StratiGraph)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Emanuel Demetrescu", email = "emanuel.demetrescu@cnr.it" }]
keywords = ["extended matrix", "archaeology", "fastapi", "cidoc-crm"]

# Deliberately three lines long. StratiGraph Server adds a transport and nothing
# else, so
# its dependencies are the library it exposes plus the server that exposes it.
# Everything heavy is OPTIONAL and stays optional (see the extras): a deployment
# that only validates graphs should not have to ship PROJ or an RDF stack.
dependencies = [
    # EXACT pin, with the extras. Three reasons it is spelled this way:
    #   · PEP 440 will not resolve a pre-release unless the specifier names one,
    #     so `>=1.6` matches nothing while 1.6 is a dev series (verified: it kills
    #     the Docker build at the pip step);
    #   · dev12 is the first release that ships `s3dgraphy/api.py` — the surface
    #     this whole service wraps — so anything older cannot even import;
    #   · [geo] brings pyproj (with PROJ inside the wheel: no system GDAL) and
    #     [rdf] brings rdflib. Without them /v1/reproject and /v1/export-ttl are
    #     honest 501s rather than working endpoints.
    # Loosen to `>=1.6` once 1.6.0 final is out.
    #
    # THIS LINE IS THE ONE PLACE THE VERSION IS WRITTEN BY HAND (2026-10-24).
    # The Dockerfile's `ARG S3DGRAPHY_VERSION=` default and the dev-stack
    # compose anchor `x-s3dgraphy-version` are COPIES of it: `bump-s3dgraphy.sh`
    # writes all of them in one go, and `tests/test_s3dgraphy_pin.py` refuses a
    # build where any of them disagrees with this line.
    "s3dgraphy[geo,rdf]==1.6.0.dev31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # P1 auth: verify the realm's RS256 tokens against its published JWKS.
    #
    # A HARD dependency, not an extra, and deliberately so: making auth optional
    # would mean a build that cannot enforce it, and the failure mode of *that* is
    # a deployment which comes up open because the wheel was thin. 31 KB for PyJWT
    # plus `cryptography`, which the TLS stack already pulls in.
    #
    # PyJWT and not python-jose: one library, actively maintained, and the JWKS
    # handling is a few lines here rather than a second framework. `[crypto]`
    # brings the RSA/EC backend — without it PyJWT can only do HMAC, which is
    # exactly the algorithm we refuse.
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
# Kept as NAMES for the capabilities they buy, even though the base pin already
# carries both: `pip install stratigraph-server[geo]` reads as intent, and the day the base
# pin is loosened these are the knobs that stay meaningful.
rdf = ["s3dgraphy[rdf]==1.6.0.dev31"]      # /v1/export-ttl
geo = ["s3dgraphy[geo]==1.6.0.dev31"]      # /v1/reproject (pyproj bundles PROJ)
all = ["s3dgraphy[rdf,geo]==1.6.0.dev31"]
# The object store. Optional because a deployment that keeps its assets on a
# volume (one instance, `EM_ASSET_DIR`) does not need an S3 client — and because
# a missing client must fail at construction with a sentence, which is only
# possible if it is allowed to be missing.
s3 = ["minio>=7.2"]
# La casa dei documenti (`app/documents.py`). Opzionale per la stessa ragione per
# cui lo è il client MinIO: un nodo che tiene le sue stanze in una directory —
# un portatile, una prova — non ha nessun database da aprire, e una dipendenza
# che può mancare è l'unica che può fallire alla costruzione con una frase.
# `[pool]` e non solo il driver: `rooms()` sta sul percorso del gate IIIF, e una
# connessione nuova per ogni tile sarebbe una stretta di mano per pixel.
pg = ["psycopg[binary,pool]>=3.1"]
dev = ["pytest>=7", "httpx>=0.27", "psycopg[binary,pool]>=3.1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
